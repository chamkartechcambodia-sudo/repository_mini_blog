# Project-wide Gradle settings.

# JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use AndroidX (required for modern AndroidX libraries).
android.useAndroidX=true

# Each module gets its own R class (faster builds; AGP default).
android.nonTransitiveRClass=true

# Official Kotlin code style.
kotlin.code.style=official

# --- KSP + AGP 9 built-in Kotlin bridge -------------------------------------
# KSP 2.2.10-2.0.2 still registers its generated sources via the kotlin.sourceSets
# DSL, which AGP 9's built-in Kotlin rejects with:
#   "Using kotlin.sourceSets DSL to add Kotlin sources is not allowed with built-in Kotlin."
# Native support only arrives in the KSP 2.3.x line (needs Kotlin 2.3 / AGP 9.1). Until we
# move to that combo, this flag re-allows the legacy behavior so Room's KSP-generated code
# compiles. Do NOT remove while on KSP 2.2.x. See https://github.com/google/ksp/issues/2729
android.disallowKotlinSourceSets=false
